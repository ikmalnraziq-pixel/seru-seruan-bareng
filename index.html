<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ KASUS: OPERASI HITAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto Mono', monospace; }
        .glow { animation: glow 1.5s ease-in-out infinite alternate; }
        @keyframes glow { 
            from { box-shadow: 0 0 15px #0f0, 0 0 30px #0f0; } 
            to { box-shadow: 0 0 30px #0f0, 0 0 45px #0a0; } 
        }
        .matrix-bg {
            background-color: #000;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* STYLE TOMBOL RAHASIA */
        #secret-button {
            position: fixed;
            bottom: 10px;
            right: 15px;
            color: #333;
            font-size: 11px;
            font-family: monospace;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 5px;
            z-index: 999;
            transition: all 0.3s;
        }
        #secret-button:hover {
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }
        /* STYLE TIMER BERKEDIP */
        #timer-box {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { color: red; }
            50% { color: transparent; }
            100% { color: red; }
        }
    </style>
</head>
<body class="matrix-bg min-h-screen flex items-center justify-center p-4">

    <!-- TOMBOL RAHASIA -->
    <button id="secret-button" onclick="openSecretCode()">v.350P</button>

    <!-- MODAL INPUT KODE -->
    <div id="secret-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center">
        <div class="bg-gray-900 border-2 border-red-600 p-8 rounded-lg max-w-md w-full">
            <h2 class="text-2xl text-red-500 font-bold text-center mb-4">>>> AKSES TERBATAS <<<</h2>
            <p class="text-gray-400 text-center mb-6 text-sm">MASUKKAN KODE OTORISASI</p>
            <input type="text" id="secret-input" placeholder="ENTER CODE..." 
                class="w-full text-center text-3xl p-4 bg-black border-2 border-green-600 text-green-500 outline-none uppercase">
            <button onclick="checkSecretCode()" class="w-full mt-4 py-3 bg-red-700 hover:bg-red-600 text-white font-bold">VERIFIKASI</button>
            <p id="secret-error" class="text-red-500 text-center mt-3 hidden">ACCESS DENIED</p>
        </div>
    </div>

    <!-- LAYAR IDENTITAS -->
    <div id="identity-screen" class="hidden fixed inset-0 bg-black z-50 flex flex-col items-center justify-center">
        <h1 class="text-gray-700 text-6xl font-bold tracking-widest mb-4">IDENTIFIED</h1>
        <div class="border-4 border-green-500 p-8 rotate-2">
            <h2 id="real-name" class="text-green-500 text-7xl font-black glow tracking-wider">ALEXIEL</h2>
        </div>
        <p class="text-gray-600 mt-8 text-sm">// SUBJECT: PROFILE DELTA //</p>
    </div>

    <div id="game-container" class="bg-gray-900 rounded-lg shadow-2xl p-6 sm:p-8 max-w-lg w-full border-2 border-green-600">
        
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-green-500 mb-2">[SYSTEM ONLINE]</h1>
            <p class="text-sm text-gray-400">// LEVEL: QUANTUM DETECTIVE //</p>
            <div class="w-full bg-gray-800 rounded-full h-2 mt-2 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-green-600 to-green-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <!-- TIMER -->
            <div id="timer-container" class="hidden mt-2">
                <p class="text-xs text-red-600">DEADLINE:</p>
                <h2 id="timer-text" class="text-3xl font-bold text-red-600 timer-box">10</h2>
            </div>
        </div>

        <div id="stage-indicator" class="text-center font-bold text-sm text-green-400 mb-4 uppercase tracking-widest">
            Analisis Data 01
        </div>

        <div id="puzzle-box" class="bg-black rounded p-5 mb-6 border border-green-700">
            <h3 class="font-semibold text-green-600 mb-3 text-sm">> Query_Data:</h3>
            <div id="question-text" class="text-lg font-bold text-left text-green-300 my-3 p-4 bg-gray-900 rounded leading-relaxed">
            </div>
            <input type="text" id="answer-input" placeholder="> Enter_Answer:" 
                class="w-full text-center text-xl p-3 border-2 border-gray-700 rounded-lg focus:border-green-500 outline-none bg-black text-green-400 font-mono">
        </div>

        <div id="clue-box" class="bg-gray-800 border border-dashed border-gray-600 rounded p-4 mb-6">
            <h3 class="font-bold text-yellow-400 text-sm mb-1">// LOG_FILE.TXT</h3>
            <p id="clue-text" class="text-gray-300 text-xs">Analisis pola, urutan, dan hubungan logika.</p>
        </div>

        <div class="flex gap-4">
            <button onclick="checkAnswer()" 
                class="flex-1 bg-green-800 hover:bg-green-700 text-black font-bold py-3 px-6 rounded shadow-lg transition-colors uppercase text-sm tracking-wider">
                Execute ✅
            </button>
            <button onclick="showHint()" 
                class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded shadow-lg transition-colors text-xs">
                Decrypt 📂
            </button>
        </div>

        <div id="feedback" class="mt-6 text-center text-sm font-bold hidden rounded p-3 uppercase tracking-wider"></div>

        <div id="hint-box" class="hidden mt-4 bg-black p-4 rounded text-left text-xs border border-green-900 text-green-200">
        </div>
    </div>

    <script>
        const levels = [
            {
                stage: "Analisis Data 01: Pola Angka",
                question: "Jika 23 = 12, 24 = 21, 25 = 32, maka berapakah 26 = ...?",
                clue: "Cari pola perbedaan angka. Bukan sekadar tambah biasa.",
                hint: "23 -> 12 (selisih 11), 24->21 (selisih 3), 25->32 (selisih -7). Pola selisih: +11, -3, -7, ? Lanjut polanya.",
                answer: "43"
            },
            {
                stage: "Analisis Data 02: Geometri",
                question: "Segitiga punya 3, Kotak punya 4, Lingkaran punya 0, maka Bintang punya...?",
                clue: "Bukan jumlah sisi, tapi jumlah sesuatu yang lain.",
                hint: "Itu jumlah SUDUT atau jumlah RUANG di dalam bentuknya. Bintang ada berapa sudut?",
                answer: "5"
            },
            {
                stage: "Analisis Data 03: Kode Waktu",
                question: "Januari = 731, Februari = 828, Maret = 531. Berapakah kode April?",
                clue: "Pecah jadi 3 bagian. Huruf awal, jumlah hari, urutan bulan?",
                hint: "Jumlah huruf nama bulan, lalu jumlah hari. APRIL = 5 huruf, 30 hari.",
                answer: "530"
            },
            {
                stage: "Analisis Data 04: Anagram",
                question: "Kata 'RASIONAL' jika disusun ulang bisa jadi istilah luar angkasa. Apa itu?",
                clue: "Mainkan hurufnya. R A S I O N A L.",
                hint: "Cari istilah yang berhubungan dengan orbit.",
                answer: "ORBITALA"
            },
            {
                stage: "Analisis Data 05: Logika Abstrak",
                question: "Aku punya kota tapi tak ada rumah, punya gunung tak ada batu, punya air tapi tak ada ikan. Aku ini apa?",
                clue: "Benda mati yang bisa dilihat tapi tak bisa disentuh isinya.",
                hint: "Ada nama kota, nama gunung, nama sungai. Tapi semuanya cuma gambar.",
                answer: "PETA"
            },
            {
                stage: ">>> FINAL PROTOCOL: IDENTITAS TARGET",
                question: "Ambil digit terakhir atau huruf depan dari setiap kunci: 43, 5, 530, ORBITALA, PETA. Susun menjadi kode identitas.",
                clue: "Ambil angka terakhir atau huruf awal. 3, 5, 0, O, P.",
                hint: "Susun menjadi kode rahasia.",
                answer: "K350P"
            }
        ];

        let currentLevel = 0;
        let timeLeft = 10;
        let timerInterval;

        // >>> INI PENTING: WAKTU BERHENTI KALO KLIK TOMBOL <<<
        function openSecretCode() {
            clearInterval(timerInterval); // MATIKAN TIMER SEKARANG
            document.getElementById('timer-container').classList.add('hidden');
            document.getElementById('secret-modal').classList.remove('hidden');
            document.getElementById('secret-input').value = '';
            document.getElementById('secret-error').classList.add('hidden');
        }

        function checkSecretCode() {
            const code = document.getElementById('secret-input').value.toUpperCase().trim();
            if(code === "K350P") {
                document.getElementById('secret-modal').classList.add('hidden');
                document.getElementById('identity-screen').classList.remove('hidden');
                document.getElementById('real-name').innerText = "ALEXIEL";
            } else {
                document.getElementById('secret-error').classList.remove('hidden');
            }
        }

        // FUNGSI TIMER
        function startTimer() {
            timeLeft = 10;
            document.getElementById('timer-text').innerText = timeLeft;
            document.getElementById('timer-container').classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = timeLeft;

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    resetGame(); // RESET OTOMATIS
                }
            }, 1000);
        }

        function resetGame() {
            currentLevel = 0;
            document.getElementById('feedback').innerHTML = "⏰ <b>WAKTU HABIS!</b> <br> SISTEM RESET... MULAI DARI AWAL!";
            document.getElementById('feedback').className = "mt-6 text-center text-sm font-bold rounded p-3 uppercase tracking-wider bg-red-900 text-red-300 border border-red-600";
            document.getElementById('feedback').classList.remove('hidden');
            
            setTimeout(() => {
                loadLevel();
            }, 1500);
        }

        // FUNGSI GAME
        function loadLevel() {
            const level = levels[currentLevel];
            document.getElementById('stage-indicator').innerText = level.stage;
            document.getElementById('question-text').innerText = level.question;
            document.getElementById('clue-text').innerText = level.clue;
            document.getElementById('hint-box').innerText = level.hint;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('timer-container').classList.add('hidden');
            document.getElementById('answer-input').style.display = 'block'; // Balikin input kalau reset
            
            const progress = ((currentLevel + 1) / levels.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer-input').value.toUpperCase().trim();
            const correctAnswer = levels[currentLevel].answer;
            const feedbackBox = document.getElementById('feedback');

            if (userAnswer === correctAnswer) {
                feedbackBox.className = "mt-6 text-center text-sm font-bold rounded p-3 uppercase tracking-wider bg-green-900 text-green-300 border border-green-600";
                
                if(currentLevel < levels.length - 1) {
                    feedbackBox.innerHTML = `> STATUS: ACCEPTED <br> > VARIABLE_SET: <b>${correctAnswer}</b>`;
                    setTimeout(() => {
                        currentLevel++;
                        loadLevel();
                    }, 1500);
                } else {
                    // TAHAP AKHIR: JALANKAN TIMER!
                    feedbackBox.innerHTML = `> KODE: <span class="text-3xl glow">K350P</span> <br> CARI AKSES SEKARANG!`;
                    document.getElementById('question-text').innerHTML = "<span class='text-red-500 text-xl'>// HITUNG MUNDUR DIMULAI //</span>";
                    document.getElementById('answer-input').style.display = 'none';
                    
                    startTimer(); // START 10 DETIK
                }
            } else {
                feedbackBox.className = "mt-6 text-center text-sm font-bold rounded p-3 uppercase tracking-wider bg-red-900 text-red-300 border border-red-600";
                feedbackBox.innerHTML = `> ERROR_404: LOGIC_FAILED <br> > Silakan rekalibrasi pemikiran.`;
            }
            feedbackBox.classList.remove('hidden');
        }

        function showHint() {
            document.getElementById('hint-box').classList.toggle('hidden');
        }

        window.onload = loadLevel;
    </script>

</body>
</html>

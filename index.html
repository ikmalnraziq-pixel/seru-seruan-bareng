<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUKEMAP - Google Maps Style (No API Key)</title>
    <!-- Gunakan Leaflet dengan lapisan peta yang sama gaya Google Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
        body { background: #f5f5f5; }

        /* Peta Penuh Layar */
        #map { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1;
        }

        /* Gaya Peta Mirip Google Maps */
        .leaflet-tile {
            image-rendering: optimizeQuality;
        }
        .leaflet-control-zoom {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            border: none !important;
        }
        .leaflet-control-zoom a {
            background: #fff;
            color: #333;
            border-bottom: 1px solid #eee !important;
            border-radius: 0 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #f8f8f8;
        }
        .leaflet-control-zoom-in {
            border-top-left-radius: 8px !important;
            border-top-right-radius: 8px !important;
        }
        .leaflet-control-zoom-out {
            border-bottom-left-radius: 8px !important;
            border-bottom-right-radius: 8px !important;
        }
        .leaflet-attribution-control {
            background: rgba(255,255,255,0.8);
            border-radius: 4px;
            font-size: 11px;
            color: #666;
        }

        /* Tombol GPS Mirip Google Maps */
        #gps-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #333;
            transition: background 0.2s ease;
        }
        #gps-btn:hover {
            background: #f8f8f8;
        }
        #gps-btn:active {
            background: #f0f0f0;
        }

        /* Marker Lokasi Pengguna */
        .user-location-icon {
            background: url('https://cdn-icons-png.flaticon.com/512/149/149060.png') no-repeat center center;
            background-size: 90% 90%;
            width: 35px;
            height: 35px;
            animation: pulse-location 2s infinite alternate;
        }
        @keyframes pulse-location {
            from { opacity: 0.7; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* Panel Judul NUKEMAP */
        #title-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.2);
            z-index: 10;
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="title-panel">NUKEMAP - Google Maps Style</div>
    <div id="map"></div>
    <button id="gps-btn">📍</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi Peta dengan Lapisan Mirip Google Maps (Tidak Perlu API Key)
        const map = L.map('map').setView([-6.1754, 106.8272], 13); // Default lokasi Jakarta

        // Gunakan Lapisan Peta yang Sama Gaya Google Maps dari OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
            minZoom: 1,
            tileSize: 256
        }).addTo(map);

        // Variabel untuk Marker Lokasi Pengguna
        let userMarker = null;

        // Fitur GPS - Temukan Lokasi Pengguna
        const gpsBtn = document.getElementById('gps-btn');
        
        gpsBtn.addEventListener('click', () => {
            // Tampilkan loading pada tombol
            gpsBtn.textContent = '🔄';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    // Jika Sukses Mendapatkan Lokasi
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        // Hapus marker lama jika ada
                        if (userMarker) map.removeLayer(userMarker);

                        // Tambahkan marker lokasi pengguna
                        userMarker = L.marker([lat, lon], {
                            icon: L.divIcon({ className: 'user-location-icon' })
                        }).addTo(map);
                        userMarker.bindPopup('Anda berada di sini!').openPopup();

                        // Zoom ke lokasi pengguna
                        map.setView([lat, lon], 16, {
                            animate: true,
                            duration: 1.5
                        });

                        // Kembalikan ikon tombol
                        gpsBtn.textContent = '📍';
                    },
                    // Jika Gagal Mendapatkan Lokasi
                    (error) => {
                        let errorMsg = '';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMsg = 'Izin akses lokasi ditolak. Silakan aktifkan izin di pengaturan browser.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMsg = 'Data lokasi tidak tersedia.';
                                break;
                            case error.TIMEOUT:
                                errorMsg = 'Waktu pencarian lokasi habis.';
                                break;
                            case error.UNKNOWN_ERROR:
                                errorMsg = 'Terjadi kesalahan tidak diketahui.';
                                break;
                        }
                        alert(errorMsg);
                        gpsBtn.textContent = '📍';
                    },
                    {
                        enableHighAccuracy: true, // Gunakan GPS jika tersedia
                        timeout: 10000, // Waktu tunggu maksimal 10 detik
                        maximumAge: 0 // Jangan gunakan lokasi yang disimpan
                    }
                );
            } else {
                alert('Browser Anda tidak mendukung fitur lokasi GPS.');
                gpsBtn.textContent = '📍';
            }
        });

        // Fitur Zoom dengan Scroll Tanpa Ctrl
        map.scrollWheelZoom.enable();

        // Fitur Geser Peta dengan Klik dan Tahan
        map.dragging.enable();
    </script>
</body>
</html>
